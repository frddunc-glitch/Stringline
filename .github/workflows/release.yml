name: Release

# Pushing a tag like v0.2.0, or publishing a release on GitHub, builds, tests and publishes Stringline and attaches the
# zip and the installer to the tag's release (made as a draft if there isn't one yet). Running it by hand
# (Actions ▸ Release ▸ Run workflow) with a tag fills in that tag's release; with no tag it builds the files as
# workflow artifacts only. A release that already has its files is left alone, so a tag push and a publish of the same
# release don't build twice.
on:
  push:
    tags: ['v*', 'V*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release should get the files (blank = artifacts only)
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TAG || github.ref }}

      - name: Check release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $skip = 'false'
          if ($env:TAG) {
            $assets = gh release view $env:TAG --json assets --jq '.assets[].name' 2>$null
            if ($LASTEXITCODE -eq 0 -and ($assets | Where-Object { $_ -like '*-setup.exe' })) {
              Write-Host "Release $env:TAG already has its files; nothing to do."
              $skip = 'true'
            }
          }
          "skip=$skip" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v6
        if: steps.check.outputs.skip != 'true'
        with:
          global-json-file: global.json

      - name: Version
        if: steps.check.outputs.skip != 'true'
        id: version
        shell: pwsh
        run: |
          if ($env:TAG) { $v = $env:TAG.TrimStart('v', 'V') }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: dotnet test Stringline.sln -c Release -warnaserror

      - name: Install Inno Setup
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.version }} -Installer

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          name: stringline-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe

      - name: Attach to release
        if: steps.check.outputs.skip != 'true' && env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = "artifacts/Stringline-$env:VERSION-setup.exe", "artifacts/Stringline-$env:VERSION-win-x64.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG @files --clobber }
          else { gh release create $env:TAG --draft --title "Stringline $env:VERSION" --generate-notes @files }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
