name: Release

# Pushing a tag like v0.2.0, or publishing a release on GitHub, builds, tests and publishes Stringline and attaches the
# zip and the installer to the tag's release (made as a draft if there isn't one yet). Running it by hand
# (Actions ▸ Release ▸ Run workflow) with a tag fills in that tag's release; with no tag it builds the files as
# workflow artifacts only. A release that already has its files is left alone, so a tag push and a publish of the same
# release don't build twice.
on:
  push:
    tags: ['v*', 'V*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release should get the files (blank = artifacts only)
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TAG || github.ref }}

      - name: Check release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $skip = 'false'
          if ($env:TAG) {
            $assets = gh release view $env:TAG --json assets --jq '.assets[].name' 2>$null
            if ($LASTEXITCODE -eq 0 -and ($assets | Where-Object { $_ -like '*-setup.exe' })) {
              Write-Host "Release $env:TAG already has its files; nothing to do."
              $skip = 'true'
            }
          }
          "skip=$skip" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v6
        if: steps.check.outputs.skip != 'true'
        with:
          global-json-file: global.json

      - name: Version
        if: steps.check.outputs.skip != 'true'
        id: version
        shell: pwsh
        run: |
          if ($env:TAG) { $v = $env:TAG.TrimStart('v', 'V') }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      # The runner's 1024x768 desktop caps the WPF tests' windows at about 1050 wide (see ci.yml).
      - name: Screen resolution
        if: steps.check.outputs.skip != 'true'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: dotnet test Stringline.sln -c Release -warnaserror

      - name: Install Inno Setup
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      # Code signing (#1) is optional: with the SIGN_PFX_BASE64 (and SIGN_PFX_PASSWORD) secrets set, build/sign.ps1
      # signs the exe, installer and uninstaller; without them the files are unsigned and the log says so.
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          STRINGLINE_SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'stringline-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $env:STRINGLINE_SIGN_PFX = $pfx
          }
          try { ./build/publish.ps1 -Version ${{ steps.version.outputs.version }} -Installer }
          finally { if ($pfx) { Remove-Item $pfx -Force -ErrorAction SilentlyContinue } }

      # Installs the previous release's setup (or, if it has none, an older build of this one), starts it with a
      # replay running, and updates it with the new setup while it runs; then tries a downgrade and uninstalls.
      - name: Test the update
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $new = "artifacts/Stringline-$env:VERSION-setup.exe"
          $previous = gh release list --exclude-drafts --limit 30 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          $old = $null
          if ($previous) {
            gh release download $previous --pattern '*-setup.exe' --dir artifacts/previous 2>$null
            $old = Get-ChildItem artifacts/previous -Filter '*-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $global:LASTEXITCODE = 0
          if ($old) { Write-Host "Updating from $previous"; ./build/test-upgrade.ps1 -Old $old.FullName -New $new }
          else { Write-Host 'No earlier release has a setup; updating from an older build of this one.'; ./build/test-upgrade.ps1 -New $new }

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.skip != 'true'
        with:
          name: stringline-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe

      - name: Attach to release
        if: steps.check.outputs.skip != 'true' && env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = "artifacts/Stringline-$env:VERSION-setup.exe", "artifacts/Stringline-$env:VERSION-win-x64.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG @files --clobber }
          else { gh release create $env:TAG --draft --title "Stringline $env:VERSION" --generate-notes @files }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
