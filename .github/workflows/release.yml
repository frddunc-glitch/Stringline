name: Release

# Pushing a tag like v0.2.0 builds, tests and publishes Stringline, then makes a draft GitHub release with the zip and
# the installer. Running it by hand (Actions ▸ Release ▸ Run workflow) builds the same files as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Stringline.sln -c Release -warnaserror

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.version }} -Installer

      - uses: actions/upload-artifact@v7
        with:
          name: stringline-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe

      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --title "Stringline $env:VERSION" --generate-notes `
            "artifacts/Stringline-$env:VERSION-setup.exe" "artifacts/Stringline-$env:VERSION-win-x64.zip"
