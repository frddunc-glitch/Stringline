name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds everything, including the WPF app.
          - os: windows-latest
            solution: Stringline.sln
          # Linux builds and tests the portable projects only (no Stringline.App).
          - os: ubuntu-latest
            solution: Stringline.Portable.slnf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore -warnaserror -c Release

      # The hosted runner's desktop is 1024x768, and Windows caps a window at about the screen's size, so the WPF
      # tests' 1280- and 1400-wide windows came out 1050 wide. Give them a full-HD screen.
      - name: Screen resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Test
        run: dotnet test ${{ matrix.solution }} --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
